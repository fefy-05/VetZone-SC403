<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{consulta.titulo} + ' | VetZone'">
        Consultas médicas | VetZone
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="mb-1"
                th:text="#{consulta.titulo}">
                Consultas médicas
            </h1>

            <p class="text-muted">

                <span th:text="#{consulta.total}">
                    Total
                </span>:

                <span class="badge bg-primary"
                      th:text="${consultas.size()}">
                    0
                </span>

            </p>

        </div>

        <a class="btn btn-primary"
           th:href="@{/consultas/nueva}">

            <i class="bi bi-plus-circle me-1"></i>

            <span th:text="#{consulta.nueva}">
                Nueva consulta
            </span>

        </a>

    </div>

    <div class="alert alert-success alert-dismissible fade show"
         th:if="${ok}">

        <span th:text="${ok}">
            Operación realizada correctamente
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <div class="alert alert-danger alert-dismissible fade show"
         th:if="${error}">

        <span th:text="${error}">
            Error
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <div class="row g-3">

        <div class="col-12 col-md-6 col-lg-4"
             th:each="c : ${consultas}">

            <div class="card h-100 shadow-sm">

                <div class="card-body d-flex flex-column">

                    <div class="d-flex justify-content-between align-items-start mb-2">

                        <span class="badge bg-secondary"
                              th:text="#{consulta.nombre}">
                            Consulta médica
                        </span>

                        <small class="text-muted"
                               th:text="${c.fechaRegistro}">
                            Fecha
                        </small>

                    </div>

                    <h5 class="card-title"
                        th:text="#{consulta.diagnostico}">
                        Diagnóstico
                    </h5>

                    <p class="text-muted small flex-grow-1"
                       th:text="${c.diagnostico}">
                        Diagnóstico
                    </p>

                    <div class="small text-muted mb-2">

                        <i class="bi bi-calendar-check me-1"></i>

                        <span th:text="#{consulta.cita}">
                            Cita relacionada
                        </span>:

                        <span th:text="${c.cita.id}">
                            0
                        </span>

                    </div>

                    <div class="d-flex gap-2 mt-3">

                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/consultas/{id}(id=${c.id})}">

                            <i class="bi bi-eye me-1"></i>

                            <span th:text="#{boton.ver}">
                                Ver
                            </span>

                        </a>

                        <a class="btn btn-outline-warning btn-sm"
                           th:href="@{/consultas/{id}/editar(id=${c.id})}">

                            <i class="bi bi-pencil me-1"></i>

                            <span th:text="#{boton.editar}">
                                Editar
                            </span>

                        </a>

                        <button type="button"
                                class="btn btn-outline-danger btn-sm"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminar"
                                th:data-id="${c.id}">

                            <i class="bi bi-trash me-1"></i>

                            <span th:text="#{consulta.eliminar.boton}">
                                Eliminar
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="alert alert-warning mt-4"
         th:if="${consultas.isEmpty()}">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="#{consulta.vacio}">
            No hay consultas médicas para mostrar.
        </span>

    </div>

</main>

<div class="modal fade"
     id="modalEliminar"
     tabindex="-1">

    <div class="modal-dialog">

        <form id="formEliminar"
              method="post">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title"
                        th:text="#{consulta.eliminar.titulo}">
                        Confirmar eliminación
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body"
                     th:text="#{consulta.eliminar.pregunta}">
                    ¿Seguro que deseas eliminar esta consulta médica?
                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{boton.cancelar}">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="btn btn-danger"
                            th:text="#{consulta.eliminar.confirmar}">
                        Sí, eliminar
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('modalEliminar')
        .addEventListener('show.bs.modal', event => {

            const boton = event.relatedTarget;
            const id = boton.getAttribute('data-id');

            document.getElementById('formEliminar').action =
                '/consultas/' + id + '/eliminar';
        });
</script>

</body>
</html>
