<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle de consulta | VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1 class="mb-4">Detalle de la consulta médica</h1>

            <div th:if="${consulta != null}">

                <p>
                    <strong>Fecha de registro:</strong>
                    <span th:text="${consulta.fechaRegistro}">
                        Fecha
                    </span>
                </p>

                <p>
                    <strong>Diagnóstico:</strong>
                    <span th:text="${consulta.diagnostico}">
                        Diagnóstico
                    </span>
                </p>

                <p>
                    <strong>Tratamiento:</strong>
                    <span th:text="${consulta.tratamiento}">
                        Tratamiento
                    </span>
                </p>

                <p>
                    <strong>Observaciones:</strong>
                    <span th:text="${consulta.observaciones}">
                        Observaciones
                    </span>
                </p>

                <p>
                    <strong>Cita relacionada:</strong>
                    <span th:text="${consulta.cita.id}">
                        Cita
                    </span>
                </p>

                <p>
                    <strong>Mascota:</strong>
                    <span th:text="${consulta.cita.mascota.nombre}">
                        Mascota
                    </span>
                </p>

                <a class="btn btn-secondary"
                   th:href="@{/consultas}">
                    <i class="bi bi-arrow-left me-1"></i>
                    Volver
                </a>

            </div>

            <div class="alert alert-danger"
                 th:if="${consulta == null}">
                La consulta médica no fue encontrada.
            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
