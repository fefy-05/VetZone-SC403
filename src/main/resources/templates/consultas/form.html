<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{consulta.titulo} + ' | VetZone'">
        Consulta médica | VetZone
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4" style="max-width: 800px;">

    <h1 class="mb-4">

        <span th:if="${consulta.id == null}"
              th:text="#{consulta.form.nueva}">
            Registrar consulta médica
        </span>

        <span th:if="${consulta.id != null}"
              th:text="#{consulta.form.editar}">
            Editar consulta médica
        </span>

    </h1>

    <div class="alert alert-danger"
         th:if="${error}">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="${error}">
            Error
        </span>

    </div>

    <form th:object="${consulta}"
          th:action="${consulta.id == null}
                     ? @{/consultas}
                     : @{/consultas/{id}(id=${consulta.id})}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{consulta.cita}">
                Cita relacionada
            </label>

            <select class="form-select"
                    th:field="*{cita}"
                    required>

                <option value=""
                        th:text="#{consulta.seleccionarCita}">
                    Seleccione una cita
                </option>

                <option th:each="c : ${citas}"
                        th:value="${c.id}"
                        th:text="${'Cita #' + c.id
                                + ' - ' + c.mascota.nombre
                                + ' - ' + c.fechaHora
                                + ' - ' + c.veterinario.nombre
                                + ' ' + c.veterinario.apellidos}">
                    Cita
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('cita')}"
                 th:errors="*{cita}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{consulta.diagnostico}">
                Diagnóstico
            </label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{diagnostico}"
                      required>
            </textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('diagnostico')}"
                 th:errors="*{diagnostico}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{consulta.tratamiento}">
                Tratamiento
            </label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{tratamiento}">
            </textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('tratamiento')}"
                 th:errors="*{tratamiento}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{consulta.observaciones}">
                Observaciones
            </label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{observaciones}">
            </textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('observaciones')}"
                 th:errors="*{observaciones}">
            </div>

        </div>

        <button type="submit"
                class="btn btn-success">

            <i class="bi bi-save me-1"></i>

            <span th:if="${consulta.id == null}"
                  th:text="#{consulta.guardar}">
                Guardar consulta
            </span>

            <span th:if="${consulta.id != null}"
                  th:text="#{consulta.actualizar}">
                Actualizar consulta
            </span>

        </button>

        <a class="btn btn-secondary"
           th:href="@{/consultas}">

            <span th:text="#{boton.cancelar}">
                Cancelar
            </span>

        </a>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
