<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva consulta médica | VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <h1 class="mb-4">Registrar consulta médica</h1>

    <form th:object="${consulta}"
          th:action="@{/consultas}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Cita relacionada</label>

            <select class="form-select"
                    th:field="*{cita}">

                <option value="">Seleccione una cita</option>

                <option th:each="c : ${citas}"
                        th:value="${c.id}"
                        th:text="${'Cita #' + c.id + ' - ' + c.mascota.nombre + ' - ' + c.fechaHora}">
                    Cita
                </option>

            </select>

            <div class="text-danger"
                 th:errors="*{cita}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Diagnóstico</label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{diagnostico}">
            </textarea>

            <div class="text-danger"
                 th:errors="*{diagnostico}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tratamiento</label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{tratamiento}">
            </textarea>

            <div class="text-danger"
                 th:errors="*{tratamiento}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones</label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{observaciones}">
            </textarea>

            <div class="text-danger"
                 th:errors="*{observaciones}">
            </div>
        </div>

        <button type="submit"
                class="btn btn-success">
            <i class="bi bi-save me-1"></i>
            Guardar consulta
        </button>

        <a class="btn btn-secondary"
           th:href="@{/consultas}">
            Cancelar
        </a>

    </form>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
