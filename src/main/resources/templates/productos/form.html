<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4" style="max-width:700px;">

        <h2 class="mb-4"
            th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">
            Producto
        </h2>

        <form th:object="${producto}"
              method="post"
              th:action="${producto.id == null} ? @{/productos} : @{/productos/{id}(id=${producto.id})}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text"
                       class="form-control"
                       th:field="*{nombre}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control"
                          rows="3"
                          th:field="*{descripcion}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number"
                       step="0.01"
                       min="0"
                       class="form-control"
                       th:field="*{precio}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input type="number"
                       min="0"
                       class="form-control"
                       th:field="*{stock}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>

                <select class="form-select"
                        th:field="*{categoria}"
                        required>

                    <option value="">Seleccione una categoría</option>

                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.id}"
                            th:text="${categoria.nombre}">
                    </option>

                </select>

            </div>

            <div class="d-flex justify-content-end gap-2">

                <a th:href="@{/productos}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    Guardar
                </button>

            </div>

        </form>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
