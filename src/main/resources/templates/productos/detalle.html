<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4" style="max-width: 720px;">

    <div th:if="${producto == null}" class="alert alert-warning">
        <i class="bi bi-exclamation-triangle me-2"></i>
        Producto no encontrado.
    </div>

    <div th:if="${producto != null}" class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-start mb-3">

                <h1 class="h3 mb-0"
                    th:text="${producto.nombre}">
                    Nombre
                </h1>

                <span class="badge bg-primary"
                      th:text="${producto.categoria.nombre}">
                    Categoría
                </span>

            </div>

            <hr>

            <dl class="row">

                <dt class="col-sm-4">Descripción</dt>
                <dd class="col-sm-8"
                    th:text="${producto.descripcion}">
                </dd>

                <dt class="col-sm-4">Precio</dt>
                <dd class="col-sm-8"
                    th:text="${producto.precio}">
                </dd>

                <dt class="col-sm-4">Stock</dt>
                <dd class="col-sm-8"
                    th:text="${producto.stock}">
                </dd>

            </dl>

            <div class="d-flex justify-content-end gap-2">

                <a th:href="@{/productos}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Volver

                </a>

                <a th:href="@{/productos/{id}/editar(id=${producto.id})}"
                   class="btn btn-warning">

                    <i class="bi bi-pencil me-1"></i>

                    Editar

                </a>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
