<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Productos</h1>

            <p class="text-muted">
                Total:
                <span class="badge bg-primary" th:text="${productos.size()}">0</span>
            </p>

        </div>

        <a th:href="@{/productos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i>
            Nuevo producto
        </a>

    </div>

    <table class="table table-hover">

        <thead class="table-light">

        <tr>

            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th></th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="producto : ${productos}">

            <td th:text="${producto.nombre}"></td>

            <td th:text="${producto.categoria.nombre}"></td>

            <td th:text="${producto.precio}"></td>

            <td th:text="${producto.stock}"></td>

            <td>

                <a class="btn btn-outline-primary btn-sm"
                   th:href="@{/productos/{id}(id=${producto.id})}">
                    Ver
                </a>

                <a class="btn btn-outline-warning btn-sm"
                   th:href="@{/productos/{id}/editar(id=${producto.id})}">
                    Editar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
