<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del cliente | VetZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4" style="max-width: 720px;">

        <div th:if="${cliente == null}" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Cliente no encontrado.
        </div>

        <div th:if="${cliente != null}" class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 mb-3" th:text="${cliente.nombreCompleto}">Nombre</h1>

                <hr>

                <dl class="row mb-0">
                    <dt class="col-sm-4">Cedula</dt>
                    <dd class="col-sm-8" th:text="${cliente.cedula}">cedula</dd>

                    <dt class="col-sm-4">Telefono</dt>
                    <dd class="col-sm-8" th:text="${cliente.telefono}">telefono</dd>

                    <dt class="col-sm-4">Correo</dt>
                    <dd class="col-sm-8" th:text="${cliente.correo}">correo</dd>

                    <dt class="col-sm-4">Direccion</dt>
                    <dd class="col-sm-8" th:text="${cliente.direccion}">direccion</dd>
                </dl>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/clientes}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                    <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}" class="btn btn-warning">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
