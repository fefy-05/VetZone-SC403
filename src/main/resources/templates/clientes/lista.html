<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | VetZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">

        <div class="alert alert-success alert-dismissible fade show" th:if="${ok}">
            <span th:text="${ok}">Listo</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Clientes</h1>
                <p class="text-muted mb-0">
                    Total: <span class="badge bg-primary" th:text="${clientes.size()}">0</span>
                </p>
            </div>

            <a th:href="@{/clientes/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i>Nuevo cliente
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Cedula</th>
                        <th>Telefono</th>
                        <th>Correo</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.nombreCompleto}">Nombre</td>
                        <td th:text="${c.cedula}">Cedula</td>
                        <td th:text="${c.telefono}">Telefono</td>
                        <td th:text="${c.correo}">Correo</td>
                        <td class="text-end">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/clientes/{id}(id=${c.id})}">Ver</a>
                            <a class="btn btn-outline-warning btn-sm"
                                th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
                            <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal"
                                data-bs-target="#modalEliminar" th:data-id="${c.id}"
                                th:data-nombre="${c.nombreCompleto}">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-warning" th:if="${clientes.isEmpty()}">
            <i class="bi bi-exclamation-triangle me-2"></i>
            No hay clientes registrados.
        </div>

    </main>

    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar eliminacion</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Seguro que quieres eliminar a
                    <strong id="nombreClienteEliminar">este cliente</strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminar" method="post">
                        <button type="submit" class="btn btn-danger">Si, eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const modalEliminar = document.getElementById('modalEliminar');

        if (modalEliminar) {
            modalEliminar.addEventListener('show.bs.modal', function (event) {
                const boton = event.relatedTarget;
                const id = boton.getAttribute('data-id');
                const nombre = boton.getAttribute('data-nombre');

                document.getElementById('nombreClienteEliminar').textContent = nombre;
                document.getElementById('formEliminar').setAttribute('action', '/clientes/' + id + '/eliminar');
            });
        }
    </script>

</body>

</html>
