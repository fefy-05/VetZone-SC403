<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="#{cliente.titulo} + ' | VetZone'">
        Clientes | VetZone
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <!-- Mensaje de éxito -->
    <div class="alert alert-success alert-dismissible fade show"
         th:if="${ok}">

        <span th:text="${ok}">
            Listo
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <!-- Mensaje de error -->
    <div class="alert alert-danger alert-dismissible fade show"
         th:if="${error}">

        <span th:text="${error}">
            Error
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="mb-1"
                th:text="#{cliente.titulo}">
                Clientes
            </h1>

            <p class="text-muted mb-0">

                <span th:text="#{cliente.total}">
                    Total
                </span>:

                <span class="badge bg-primary"
                      th:text="${clientes.size()}">
                    0
                </span>

            </p>

        </div>

        <a th:href="@{/clientes/nuevo}"
           class="btn btn-primary btn-sm">

            <i class="bi bi-plus-circle me-1"></i>

            <span th:text="#{cliente.nuevo}">
                Nuevo cliente
            </span>

        </a>

    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">

            <tr>

                <th th:text="#{cliente.nombre}">
                    Nombre
                </th>

                <th th:text="#{cliente.cedula}">
                    Cédula
                </th>

                <th th:text="#{cliente.telefono}">
                    Teléfono
                </th>

                <th th:text="#{cliente.correo}">
                    Correo
                </th>

                <th class="text-end"
                    th:text="#{cliente.acciones}">
                    Acciones
                </th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="c : ${clientes}">

                <td th:text="${c.nombreCompleto}">
                    Nombre
                </td>

                <td th:text="${c.cedula}">
                    Cédula
                </td>

                <td th:text="${c.telefono}">
                    Teléfono
                </td>

                <td th:text="${c.correo}">
                    Correo
                </td>

                <td class="text-end">

                    <!-- Ver -->
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/clientes/{id}(id=${c.id})}">

                        <i class="bi bi-eye me-1"></i>

                        <span th:text="#{boton.ver}">
                            Ver
                        </span>

                    </a>

                    <!-- Editar -->
                    <a class="btn btn-outline-warning btn-sm"
                       th:href="@{/clientes/{id}/editar(id=${c.id})}">

                        <i class="bi bi-pencil me-1"></i>

                        <span th:text="#{boton.editar}">
                            Editar
                        </span>

                    </a>

                    <!-- Desactivar -->
                    <button type="button"
                            class="btn btn-outline-danger btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#modalEliminar"
                            th:data-id="${c.id}"
                            th:data-nombre="${c.nombreCompleto}">

                        <i class="bi bi-person-x me-1"></i>

                        <span th:text="#{boton.eliminar}">
                            Desactivar
                        </span>

                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- Sin clientes -->
    <div class="alert alert-warning"
         th:if="${clientes.isEmpty()}">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="#{cliente.vacio}">
            No hay clientes registrados.
        </span>

    </div>

</main>


<!-- ===================================================== -->
<!-- MODAL PARA DESACTIVAR CLIENTE                         -->
<!-- ===================================================== -->

<div class="modal fade"
     id="modalEliminar"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-danger text-white">

                <h5 class="modal-title"
                    th:text="#{cliente.eliminar.titulo}">
                    Confirmar desactivación
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <span th:text="#{cliente.eliminar.pregunta}">
                    ¿Seguro que deseas desactivar a
                </span>

                <strong id="nombreClienteEliminar">
                    este cliente
                </strong>?

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    <span th:text="#{boton.cancelar}">
                        Cancelar
                    </span>

                </button>

                <!-- Formulario POST -->
                <form id="formEliminar"
                      method="post">

                    <!-- TOKEN CSRF DE SPRING SECURITY -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="btn btn-danger">

                        <i class="bi bi-person-x me-1"></i>

                        <span th:text="#{cliente.eliminar.confirmar}">
                            Sí, desactivar
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

    const modalEliminar =
        document.getElementById('modalEliminar');

    if (modalEliminar) {

        modalEliminar.addEventListener(
            'show.bs.modal',
            function (event) {

                const boton =
                    event.relatedTarget;

                const id =
                    boton.getAttribute('data-id');

                const nombre =
                    boton.getAttribute('data-nombre');

                document.getElementById(
                    'nombreClienteEliminar'
                ).textContent = nombre;

                document.getElementById(
                    'formEliminar'
                ).setAttribute(
                    'action',
                    '/clientes/' + id + '/eliminar'
                );

            }
        );
    }

</script>

</body>
</html>
