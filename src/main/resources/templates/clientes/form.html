<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente.id == null} ? 'Nuevo cliente' : 'Editar cliente'">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">
        <div class="card shadow mx-auto" style="max-width: 720px;">
            <div class="card-header">
                <h4 class="mb-0" th:text="${cliente.id == null} ? 'Nuevo cliente' : 'Editar cliente'">
                    Cliente
                </h4>
            </div>

            <div class="card-body">
                <form th:action="${cliente.id == null} ? @{/clientes} : @{/clientes/{id}(id=${cliente.id})}"
                    th:object="${cliente}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                                Error nombre
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" class="form-control" th:field="*{apellidos}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('apellidos')}"
                                th:errors="*{apellidos}">
                                Error apellidos
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cedula</label>
                            <input type="text" class="form-control" th:field="*{cedula}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}">
                                Error cedula
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefono</label>
                            <input type="text" class="form-control" th:field="*{telefono}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}"
                                th:errors="*{telefono}">
                                Error telefono
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" th:field="*{correo}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">
                            Error correo
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Direccion</label>
                        <textarea class="form-control" rows="2" th:field="*{direccion}"></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('direccion')}"
                            th:errors="*{direccion}">
                            Error direccion
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                        <a class="btn btn-secondary" th:href="@{/clientes}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
