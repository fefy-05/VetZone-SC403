<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Registrar Usuario</h2>

    <form th:action="@{/usuarios}"
          th:object="${usuario}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <!-- Nombre -->
        <div class="mb-3">

            <label for="nombre" class="form-label">
                Nombre
            </label>

            <input type="text"
                   id="nombre"
                   class="form-control"
                   th:field="*{nombre}"
                   required>

        </div>

        <!-- Apellidos -->
        <div class="mb-3">

            <label for="apellidos" class="form-label">
                Apellidos
            </label>

            <input type="text"
                   id="apellidos"
                   class="form-control"
                   th:field="*{apellidos}"
                   required>

        </div>

        <!-- Correo -->
        <div class="mb-3">

            <label for="correo" class="form-label">
                Correo
            </label>

            <input type="email"
                   id="correo"
                   class="form-control"
                   th:field="*{correo}"
                   required>

        </div>

        <!-- Password -->
        <div class="mb-3">

            <label for="password" class="form-label">
                Contraseña
            </label>

            <input type="password"
                   id="password"
                   class="form-control"
                   th:field="*{password}"
                   required>

        </div>

        <!-- Rol -->
        <div class="mb-3">

            <label for="rolId" class="form-label">
                Rol
            </label>

            <select id="rolId"
                    name="rolId"
                    class="form-control"
                    required>

                <option value="">
                    Seleccione un rol
                </option>

                <option th:each="rol : ${roles}"
                        th:value="${rol.id}"
                        th:text="${rol.nombre}">
                </option>

            </select>

        </div>

        <!-- Botones -->
        <button type="submit"
                class="btn btn-primary">

            Guardar

        </button>

        <a th:href="@{/usuarios}"
           class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</div>

</body>
