<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Nuevo Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body>


<div class="container mt-4">


    <h2>Registrar Usuario</h2>


    <form th:action="@{/usuarios}"
          th:object="${usuario}"
          method="post">


        <div class="mb-3">

            <label>Nombre</label>

            <input type="text"
                   class="form-control"
                   th:field="*{nombre}">

        </div>



        <div class="mb-3">

            <label>Apellidos</label>

            <input type="text"
                   class="form-control"
                   th:field="*{apellidos}">

        </div>



        <div class="mb-3">

            <label>Correo</label>

            <input type="email"
                   class="form-control"
                   th:field="*{correo}">

        </div>



        <div class="mb-3">

            <label>Password</label>

            <input type="password"
                   class="form-control"
                   th:field="*{password}">

        </div>



        <div class="mb-3">

            <label>Rol</label>


            <select class="form-control"
                    th:field="*{rol}">


                <option value="">
                    Seleccione un rol
                </option>


                <option th:each="rol : ${roles}"
                        th:value="${rol.id}"
                        th:text="${rol.nombre}">
                </option>


            </select>


        </div>



        <button type="submit"
                class="btn btn-primary">

            Guardar

        </button>


        <a href="/usuarios"
           class="btn btn-secondary">

            Cancelar

        </a>


    </form>


</div>


</body>

</html>
