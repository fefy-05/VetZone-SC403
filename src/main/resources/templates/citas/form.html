<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{cita.form.titulo} + ' | VetZone'">
        Formulario de cita | VetZone
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4" style="max-width: 750px;">

    <h1 class="mb-4"
        th:text="${cita.id == null}
                 ? #{cita.form.nueva}
                 : #{cita.form.editar}">
        Cita
    </h1>

    <div class="alert alert-danger"
         th:if="${error}">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="${error}">
            Error
        </span>

    </div>

    <form th:object="${cita}"
          th:action="${cita.id == null}
                     ? @{/citas}
                     : @{/citas/{id}(id=${cita.id})}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{cita.fechaHora}">
                Fecha y hora
            </label>

            <input type="datetime-local"
                   class="form-control"
                   th:field="*{fechaHora}">

            <div class="text-danger"
                 th:errors="*{fechaHora}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{cita.motivo}">
                Motivo
            </label>

            <textarea class="form-control"
                      rows="3"
                      th:field="*{motivo}">
            </textarea>

            <div class="text-danger"
                 th:errors="*{motivo}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{cita.estado}">
                Estado
            </label>

            <select class="form-select"
                    th:field="*{estado}">

                <option value="PENDIENTE"
                        th:text="#{cita.estado.pendiente}">
                    Pendiente
                </option>

                <option value="CONFIRMADA"
                        th:text="#{cita.estado.confirmada}">
                    Confirmada
                </option>

                <option value="CANCELADA"
                        th:text="#{cita.estado.cancelada}">
                    Cancelada
                </option>

                <option value="ATENDIDA"
                        th:text="#{cita.estado.atendida}">
                    Atendida
                </option>

            </select>

            <div class="text-danger"
                 th:errors="*{estado}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{cita.mascota}">
                Mascota
            </label>

            <select class="form-select"
                    th:field="*{mascota}">

                <option value=""
                        th:text="#{cita.seleccionarMascota}">
                    Seleccione una mascota
                </option>

                <option th:each="m : ${mascotas}"
                        th:value="${m.id}"
                        th:text="${m.nombre}">
                    Mascota
                </option>

            </select>

            <div class="text-danger"
                 th:errors="*{mascota}">
            </div>

        </div>

        <div class="mb-3">

            <label class="form-label"
                   th:text="#{cita.veterinario}">
                Veterinario
            </label>

            <select class="form-select"
                    th:field="*{veterinario}">

                <option value=""
                        th:text="#{cita.seleccionarVeterinario}">
                    Seleccione un veterinario
                </option>

                <option th:each="v : ${veterinarios}"
                        th:value="${v.id}"
                        th:text="${v.nombre + ' ' + v.apellidos}">
                    Veterinario
                </option>

            </select>

            <div class="text-danger"
                 th:errors="*{veterinario}">
            </div>

        </div>

        <button type="submit"
                class="btn btn-success">

            <i class="bi bi-save me-1"></i>

            <span th:text="#{boton.guardar}">
                Guardar
            </span>

        </button>

        <a class="btn btn-secondary"
           th:href="@{/citas}"
           th:text="#{boton.cancelar}">
            Cancelar
        </a>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
