<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{cita.detalle} + ' | VetZone'">
        Detalle de cita | VetZone
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1 class="mb-4"
                th:text="#{cita.detalle}">
                Detalle de la cita
            </h1>

            <div th:if="${cita != null}">

                <p>
                    <strong th:text="#{cita.fechaHora}">
                        Fecha y hora
                    </strong>:

                    <span th:text="${cita.fechaHora}">
                        Fecha
                    </span>
                </p>

                <p>
                    <strong th:text="#{cita.motivo}">
                        Motivo
                    </strong>:

                    <span th:text="${cita.motivo}">
                        Motivo
                    </span>
                </p>

                <p>
                    <strong th:text="#{cita.estado}">
                        Estado
                    </strong>:

                    <span class="badge bg-secondary">

                        <span th:if="${cita.estado.name() == 'PENDIENTE'}"
                              th:text="#{cita.estado.pendiente}">
                            Pendiente
                        </span>

                        <span th:if="${cita.estado.name() == 'CONFIRMADA'}"
                              th:text="#{cita.estado.confirmada}">
                            Confirmada
                        </span>

                        <span th:if="${cita.estado.name() == 'ATENDIDA'}"
                              th:text="#{cita.estado.atendida}">
                            Atendida
                        </span>

                        <span th:if="${cita.estado.name() == 'CANCELADA'}"
                              th:text="#{cita.estado.cancelada}">
                            Cancelada
                        </span>

                    </span>
                </p>

                <p>
                    <strong th:text="#{cita.mascota}">
                        Mascota
                    </strong>:

                    <span th:text="${cita.mascota.nombre}">
                        Mascota
                    </span>
                </p>

                <p>
                    <strong th:text="#{cita.veterinario}">
                        Veterinario
                    </strong>:

                    <span th:text="${cita.veterinario.nombre + ' ' + cita.veterinario.apellidos}">
                        Veterinario
                    </span>
                </p>

                <div class="d-flex gap-2 mt-4">

                    <a class="btn btn-warning"
                       th:if="${cita.estado.name() != 'ATENDIDA'
                              and cita.estado.name() != 'CANCELADA'}"
                       th:href="@{/citas/{id}/editar(id=${cita.id})}">

                        <i class="bi bi-pencil me-1"></i>

                        <span th:text="#{boton.editar}">
                            Editar
                        </span>

                    </a>

                    <a class="btn btn-secondary"
                       th:href="@{/citas}">

                        <i class="bi bi-arrow-left me-1"></i>

                        <span th:text="#{boton.volver}">
                            Volver
                        </span>

                    </a>

                </div>

            </div>

            <div class="alert alert-danger"
                 th:if="${cita == null}"
                 th:text="#{cita.noEncontrada}">
                La cita no fue encontrada.
            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
