<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{cita.titulo}">Citas | VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <!-- Título -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1" th:text="#{cita.titulo}">
                Citas
            </h1>

            <p class="text-muted">
                <span th:text="#{cita.total}">
                    Total
                </span>:

                <span class="badge bg-primary"
                      th:text="${citas.size()}">
                    0
                </span>
            </p>
        </div>

        <a class="btn btn-primary"
           th:href="@{/citas/nueva}">

            <i class="bi bi-plus-circle me-1"></i>

            <span th:text="#{cita.nueva}">
                Nueva cita
            </span>

        </a>

    </div>

    <!-- Mensaje de éxito -->
    <div class="alert alert-success alert-dismissible fade show"
         th:if="${ok}">

        <span th:text="${ok}">
            Operación realizada correctamente
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <!-- Listado -->
    <div class="row g-3">

        <div class="col-12 col-md-6 col-lg-4"
             th:each="c : ${citas}">

            <div class="card h-100 shadow-sm">

                <div class="card-body d-flex flex-column">

                    <!-- Estado y fecha -->
                    <div class="d-flex justify-content-between align-items-start mb-2">

                        <span class="badge bg-secondary">

                            <span th:if="${c.estado == 'PENDIENTE'}"
                                  th:text="#{estado.PENDIENTE}">
                                Pending
                            </span>

                            <span th:if="${c.estado == 'CONFIRMADA'}"
                                  th:text="#{estado.CONFIRMADA}">
                                Confirmed
                            </span>

                            <span th:if="${c.estado == 'CANCELADA'}"
                                  th:text="#{estado.CANCELADA}">
                                Cancelled
                            </span>

                            <span th:if="${c.estado == 'ATENDIDA'}"
                                  th:text="#{estado.ATENDIDA}">
                                Attended
                            </span>

                        </span>

                        <small class="text-muted"
                               th:text="${c.fechaHora}">
                            Fecha
                        </small>

                    </div>

                    <!-- Mascota -->
                    <h5 class="card-title"
                        th:text="${c.mascota.nombre}">
                        Mascota
                    </h5>

                    <!-- Motivo -->
                    <p class="text-muted small flex-grow-1"
                       th:text="${c.motivo}">
                        Motivo de la cita
                    </p>

                    <!-- Acciones -->
                    <div class="d-flex gap-2 mt-3">

                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/citas/{id}(id=${c.id})}">

                            <i class="bi bi-eye me-1"></i>

                            <span th:text="#{boton.ver}">
                                Ver
                            </span>

                        </a>

                        <a class="btn btn-outline-warning btn-sm"
                           th:href="@{/citas/{id}/editar(id=${c.id})}">

                            <i class="bi bi-pencil me-1"></i>

                            <span th:text="#{boton.editar}">
                                Editar
                            </span>

                        </a>

                        <button type="button"
                                class="btn btn-outline-danger btn-sm"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminar"
                                th:data-id="${c.id}"
                                th:data-nombre="${c.mascota.nombre}">

                            <i class="bi bi-trash me-1"></i>

                            <span th:text="#{cita.eliminar}">
                                Eliminar
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Sin citas -->
    <div class="alert alert-warning mt-4"
         th:if="${citas.isEmpty()}">

        <i class="bi bi-exclamation-triangle me-2"></i>

        <span th:text="#{cita.vacio}">
            No hay citas para mostrar.
        </span>

    </div>

</main>

<!-- Modal de eliminación -->
<div class="modal fade"
     id="modalEliminar"
     tabindex="-1">

    <div class="modal-dialog">

        <form id="formEliminar"
              method="post">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title"
                        th:text="#{cita.confirmar.titulo}">
                        Confirmar eliminación
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <span th:text="#{cita.confirmar.pregunta}">
                        ¿Seguro que deseas eliminar esta cita?
                    </span>

                    <strong id="nombreModal"></strong>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{boton.cancelar}">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="btn btn-danger"
                            th:text="#{cita.eliminar}">
                        Eliminar
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

document.getElementById('modalEliminar')
    .addEventListener('show.bs.modal', event => {

        const btn = event.relatedTarget;

        const id = btn.getAttribute('data-id');

        const nombre = btn.getAttribute('data-nombre');

        document.getElementById('formEliminar').action =
            '/citas/' + id + '/eliminar';

        document.getElementById('nombreModal').textContent =
            nombre;
    });

</script>

</body>
</html>
