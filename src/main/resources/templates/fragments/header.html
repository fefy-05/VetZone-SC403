
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<body>

    <!-- ==================== NAVBAR ==================== -->
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-heart-pulse me-2"></i>VetZone
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <!-- ==================== MENÚ ==================== -->
                <ul class="navbar-nav me-auto">

                    <!-- Inicio -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}"
                           th:text="#{menu.inicio}">
                            Inicio
                        </a>
                    </li>

                    <!-- Clientes -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/clientes}"
                           th:text="#{menu.clientes}">
                            Clientes
                        </a>
                    </li>

                    <!-- Mascotas -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/mascotas}"
                           th:text="#{menu.mascotas}">
                            Mascotas
                        </a>
                    </li>

                    <!-- Citas -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/citas}"
                           th:text="#{menu.citas}">
                            Citas
                        </a>
                    </li>

                    <!-- Consultas -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/consultas}"
                           th:text="#{menu.consultas}">
                            Consultas médicas
                        </a>
                    </li>

                    <!-- Usuarios - solamente ADMIN -->
                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link"
                           th:href="@{/usuarios}"
                           th:text="#{menu.usuarios}">
                            Usuarios
                        </a>

                    </li>

                    <li class="nav-item">
                         <a class="nav-link" th:href="@{/productos}">Productos</a>
                    </li>
                </ul>


                <!-- ==================== IDIOMA ==================== -->
                <div class="dropdown me-3">

                    <button class="btn btn-sm btn-outline-light dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown">

                        <i class="bi bi-translate me-1"></i>

                        <!-- Español si el idioma actual es es -->
                        <span th:if="${#locale.language == 'es'}">
                            Español
                        </span>

                        <!-- English si el idioma actual es en -->
                        <span th:if="${#locale.language == 'en'}">
                            English
                        </span>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <a class="dropdown-item"
                               th:href="@{''(lang='es')}">
                                Español
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{''(lang='en')}">
                                English
                            </a>
                        </li>

                    </ul>

                </div>


                <!-- ==================== USUARIO ==================== -->
                <div class="d-flex align-items-center"
                     sec:authorize="isAuthenticated()">

                    <span class="navbar-text text-white me-2">

                        <i class="bi bi-person-circle me-1"></i>

                        <span sec:authentication="name">
                            usuario
                        </span>

                    </span>


                    <!-- Rol -->
                    <span class="badge bg-light text-primary me-3"
                          sec:authentication="principal.authorities">
                        ROLE_USER
                    </span>


                    <!-- Logout -->
                    <form th:action="@{/logout}"
                          method="post"
                          class="d-inline">

                        <button type="submit"
                                class="btn btn-outline-light btn-sm">

                            <i class="bi bi-box-arrow-right me-1"></i>

                            <span th:text="${#locale.language == 'es' ? 'Cerrar sesión' : 'Log out'}">
                                Cerrar sesión
                            </span>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </nav>


    <!-- ==================== FOOTER ==================== -->
    <footer th:fragment="footer"
            class="bg-light border-top mt-5 py-3">

        <div class="container text-center text-muted small">

            VetZone

        </div>

    </footer>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
