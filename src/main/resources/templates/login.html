<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login VetZone</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Iniciar sesión</h1>

    <div th:if="${param.error}" class="error">
        Correo o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="success">
        Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="campo">

            <label for="username">
                Correo:
            </label>

            <input type="email"
                   id="username"
                   name="username"
                   required>

        </div>

        <div class="campo">

            <label for="password">
                Contraseña:
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   required>

        </div>

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>

</html>
