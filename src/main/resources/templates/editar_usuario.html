
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Usuario - VetZone</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">

        <h1 class="mb-4">Editar Usuario</h1>

        <form
            th:action="@{/usuarios/editar/{id}(id=${usuario.id})}"
            th:object="${usuario}"
            method="post">

            <div class="mb-3">

                <label for="nombre" class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    class="form-control"
                    th:field="*{nombre}"
                    required>

            </div>


            <div class="mb-3">

                <label for="apellidos" class="form-label">
                    Apellidos
                </label>

                <input
                    type="text"
                    id="apellidos"
                    class="form-control"
                    th:field="*{apellidos}"
                    required>

            </div>


            <div class="mb-3">

                <label for="correo" class="form-label">
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    class="form-control"
                    th:field="*{correo}"
                    required>

            </div>


            <div class="mb-3">

                <label for="password" class="form-label">
                    Nueva contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control">

                <small class="text-muted">
                    Déjalo vacío si no deseas cambiar la contraseña.
                </small>

            </div>


            <div class="mb-3">

                <label for="rolId" class="form-label">
                    Rol
                </label>

                <select
                    id="rolId"
                    name="rolId"
                    class="form-select"
                    required>

                    <option
                        th:each="rol : ${roles}"
                        th:value="${rol.id}"
                        th:text="${rol.nombre}"
                        th:selected="${usuario.rol != null and usuario.rol.id == rol.id}">
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Guardar cambios

            </button>


            <a
                th:href="@{/usuarios}"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </main>


    <div th:replace="~{fragments/header :: footer}"></div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
