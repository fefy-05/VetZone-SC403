<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mascota.id == null} ? 'Nueva mascota' : 'Editar mascota'">Mascota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">
        <div class="card shadow mx-auto" style="max-width: 720px;">
            <div class="card-header">
                <h4 class="mb-0" th:text="${mascota.id == null} ? 'Nueva mascota' : 'Editar mascota'">
                    Mascota
                </h4>
            </div>

            <div class="card-body">
                <form th:action="${mascota.id == null} ? @{/mascotas} : @{/mascotas/{id}(id=${mascota.id})}"
                    th:object="${mascota}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <!---------- Importante --------
                     Este es el select del dueno. Thymeleaf recorre la lista de clientes que manda el controller y arma las opciones
                     El value es el id del cliente y lo que se ve es su nombre completo
                     Cuando guardamos Spring convierte ese id en el objeto Cliente solo. -->


                    <div class="mb-3">
                        <label class="form-label">Dueno</label>
                        <select class="form-select" th:field="*{cliente}">
                            <option value="">-- Seleccione un dueno --</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto}">Cliente
                            </option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">
                            Error dueno
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                                Error nombre
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Animal</label>
                            <input type="text" class="form-control" th:field="*{animal}" placeholder="Perro, Gato...">
                            <div class="text-danger small" th:if="${#fields.hasErrors('animal')}" th:errors="*{animal}">
                                Error animal
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Raza</label>
                            <input type="text" class="form-control" th:field="*{raza}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('raza')}" th:errors="*{raza}">
                                Error raza
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('fechaNacimiento')}"
                                th:errors="*{fechaNacimiento}">
                                Error fecha
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{peso}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}">
                                Error peso
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                        <a class="btn btn-secondary" th:href="@{/mascotas}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
