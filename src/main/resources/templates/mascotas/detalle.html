<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{mascota.detalle} + ' | VetZone'">Detalle de la mascota | VetZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4" style="max-width: 720px;">

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h1 class="h3 mb-0" th:text="${mascota.nombre}">Nombre</h1>
                    <span class="badge bg-secondary" th:text="${mascota.animal}">Animal</span>
                </div>

                <hr>

                <dl class="row mb-0">
                    <dt class="col-sm-4" th:text="#{mascota.dueno}">Dueno</dt>
                    <dd class="col-sm-8" th:text="${mascota.cliente.nombreCompleto}">dueno</dd>

                    <dt class="col-sm-4" th:text="#{mascota.raza}">Raza</dt>
                    <dd class="col-sm-8" th:text="${mascota.raza}">raza</dd>

                    <dt class="col-sm-4" th:text="#{mascota.fechaNacimiento}">Fecha de nacimiento</dt>
                    <dd class="col-sm-8" th:text="${mascota.fechaNacimiento}">fecha</dd>

                    <dt class="col-sm-4" th:text="#{mascota.peso}">Peso</dt>
                    <dd class="col-sm-8" th:text="${mascota.peso != null} ? ${mascota.peso} + ' kg' : '-'">peso</dd>
                </dl>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/mascotas}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i><span th:text="#{boton.volver}">Volver</span>
                    </a>
                    <a th:href="@{/mascotas/{id}/editar(id=${mascota.id})}" class="btn btn-warning">
                        <i class="bi bi-pencil me-1"></i><span th:text="#{boton.editar}">Editar</span>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
