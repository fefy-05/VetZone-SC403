<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{mascota.titulo} + ' | VetZone'">Mascotas | VetZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">

        <div class="alert alert-success alert-dismissible fade show" th:if="${ok}">
            <span th:text="${ok}">Listo</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1" th:text="#{mascota.titulo}">Mascotas</h1>
                <p class="text-muted mb-0">
                    <span th:text="#{cliente.total}">Total</span>:
                    <span class="badge bg-primary" th:text="${mascotas.size()}">0</span>
                </p>
            </div>

            <a th:href="@{/mascotas/nuevo}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i><span th:text="#{mascota.nueva}">Nueva mascota</span>
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th th:text="#{mascota.nombre}">Nombre</th>
                        <th th:text="#{mascota.animal}">Animal</th>
                        <th th:text="#{mascota.raza}">Raza</th>
                        <th th:text="#{mascota.dueno}">Dueno</th>
                        <th th:text="#{mascota.peso}">Peso</th>
                        <th class="text-end" th:text="#{cliente.acciones}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${mascotas}">
                        <td th:text="${m.nombre}">Nombre</td>
                        <td th:text="${m.animal}">Animal</td>
                        <td th:text="${m.raza}">Raza</td>

                        <!-- desde la mascota llegamos directo al dueno con m.cliente, por el @ManyToOne -->

                        <td th:text="${m.cliente.nombreCompleto}">Dueno</td>

                        <td th:text="${m.peso != null} ? ${m.peso} + ' kg' : '-'">0 kg</td>
                        <td class="text-end">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/mascotas/{id}(id=${m.id})}"
                                th:text="#{boton.ver}">Ver</a>
                            <a class="btn btn-outline-warning btn-sm" th:href="@{/mascotas/{id}/editar(id=${m.id})}"
                                th:text="#{boton.editar}">Editar</a>
                            <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal"
                                data-bs-target="#modalEliminar" th:data-id="${m.id}" th:data-nombre="${m.nombre}"
                                th:text="#{boton.eliminar}">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-warning" th:if="${mascotas.isEmpty()}">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="#{mascota.vacio}">No hay mascotas registradas.</span>
        </div>

    </main>

    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" th:text="#{mascota.eliminar.titulo}">Confirmar eliminacion</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <span th:text="#{mascota.eliminar.pregunta}">Seguro que quieres eliminar a</span>
                    <strong id="nombreMascotaEliminar" th:text="#{mascota.eliminar.esta}">esta mascota</strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        th:text="#{boton.cancelar}">Cancelar</button>
                    <form id="formEliminar" method="post">
                        <button type="submit" class="btn btn-danger" th:text="#{mascota.eliminar.confirmar}">Si,
                            eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const modalEliminar = document.getElementById('modalEliminar');

        if (modalEliminar) {
            modalEliminar.addEventListener('show.bs.modal', function (event) {
                const boton = event.relatedTarget;
                const id = boton.getAttribute('data-id');
                const nombre = boton.getAttribute('data-nombre');

                document.getElementById('nombreMascotaEliminar').textContent = nombre;
                document.getElementById('formEliminar').setAttribute('action', '/mascotas/' + id + '/eliminar');
            });
        }
    </script>

</body>

</html>
