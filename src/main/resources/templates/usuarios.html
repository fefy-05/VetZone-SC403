<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios - VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">


    <h1 class="mb-4">Usuarios registrados</h1>


    <a href="/usuarios/nuevo" class="btn btn-primary mb-3">
        Crear usuario
    </a>


    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
            </tr>

        </thead>


        <tbody>

            <tr th:each="usuario : ${usuarios}">

                <td th:text="${usuario.id}"></td>

                <td th:text="${usuario.nombre}"></td>

                <td th:text="${usuario.apellidos}"></td>

                <td th:text="${usuario.correo}"></td>

                <td th:text="${usuario.rol.nombre}"></td>


                <td>

                    <span th:if="${usuario.activo}"
                          class="badge bg-success">
                        Activo
                    </span>


                    <span th:unless="${usuario.activo}"
                          class="badge bg-danger">
                        Inactivo
                    </span>

                </td>

            </tr>

        </tbody>


    </table>


    <a href="/" class="btn btn-secondary">
        Volver al inicio
    </a>


</div>


</body>

</html>
