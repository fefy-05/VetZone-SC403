<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Usuarios - VetZone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body>

    <div th:replace="~{fragments/header :: navbar}">
    </div>


    <div class="container mt-4">

        <h1 class="mb-4">
            Usuarios registrados
        </h1>

        <a th:href="@{/usuarios/nuevo}"
           class="btn btn-primary mb-3">

            <i class="bi bi-person-plus me-1"></i>

            Crear usuario

        </a>

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.id}">
                        </td>

                        <td th:text="${usuario.nombre}">
                        </td>

                        <td th:text="${usuario.apellidos}">
                        </td>

                        <td th:text="${usuario.correo}">
                        </td>

                        <td th:text="${usuario.rol.nombre}">
                        </td>

                        <td>

                            <span th:if="${usuario.activo}"
                                  class="badge bg-success">

                                Activo

                            </span>

                            <span th:unless="${usuario.activo}"
                                  class="badge bg-danger">

                                Inactivo

                            </span>

                        </td>

                        <td>

                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                               class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square"></i>

                                Editar

                            </a>


                            <form th:if="${usuario.activo}"
                                  th:action="@{/usuarios/estado/{id}(id=${usuario.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">

                                    <i class="bi bi-person-x"></i>

                                    Desactivar

                                </button>

                            </form>


                            <!-- ACTIVAR -->

                            <form th:unless="${usuario.activo}"
                                  th:action="@{/usuarios/estado/{id}(id=${usuario.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-success btn-sm">

                                    <i class="bi bi-person-check"></i>

                                    Activar

                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <a th:href="@{/}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left me-1"></i>

            Volver al inicio

        </a>

    </div>


    <footer th:replace="~{fragments/header :: footer}">
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
